# ─────────────────────────────────────────────────────────────────
# Rebuilds the stat cards in /assets and the repository showcase in
# README.md, then commits them if anything moved.
#
# Everything is rendered inside this repository, so the profile never
# depends on a third-party stats service staying online.
# ─────────────────────────────────────────────────────────────────

name: Refresh profile

on:
  schedule:
    - cron: "17 4 * * *"     # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render banner and footer
        run: python scripts/build_header.py

      - name: Render stat cards and repository showcase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile.py --root .

      - name: Commit refreshed profile
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile stats [skip ci]"
            git push
          fi
